<script>window.CARD_DATA = {"strokes": ["M39.52,12.75c0.07,0.93,0.13,1.98-0.4,3.24c-4,9.63-11.63,23.13-26.63,35.07", "M41.75,18.88c5.09,2.2,10.6,5.25,14.5,11.12", "M32.42,35.05c0.83,0.2,1.67,0.14,2.63-0.01c4.32-0.67,8.06-1.45,11.21-1.98c0.98-0.17,2.77-0.27,3.24-0.27", "M26.27,45.15c0.73,0.35,2.21,0.52,3.71,0.29c5.14-0.79,15.85-2.18,20.28-2.74c3.11-0.39,4.8,0.2,4.3,3.79c-0.41,2.87-1.23,7.92-2.1,13.26c-0.22,1.38-0.47,1.88-0.85,4.39", "M28.59,55.31c5.91-0.68,17.16-2.06,23.97-2.6", "M26.85,65.41c6.15-1.03,15.52-2.53,24.04-2.92", "M27.28,46.16c0.5,0.75,0.84,1.67,0.63,3.28C26.12,63.25,23,80.5,13.52,92.33", "M27.74,76.26c0.73,0.68,1.4,1.77,1.5,2.77c0.84,2.9,1.43,7.11,2.25,11.22c0.25,1.22,0.45,2.41,0.6,3.5", "M29.67,77.2c5.82-0.94,16.95-2.83,22.14-3.57c3.1-0.44,4.13,0.07,3.43,3.38c-0.69,3.28-1.49,6.49-2.46,10.62", "M32.99,91.2c4.58-0.49,12.26-1.44,17.76-2.18c1.32-0.18,2.37-0.21,3.59-0.21", "M69.27,31.83c0.95,0.95,1.51,2.42,1.51,4.52c0,7.4-0.01,16.82-0.02,22.9c0,2.26,0,4.16,0,5.5", "M90.02,15.83c1.45,1.45,1.76,3.04,1.76,5.27c0,18.9-0.01,61.91-0.01,66.87c0,13.14-7.21,1.5-8.71,0.25"], "numpos": {"1": [31.5, 13.5], "2": [47.5, 18.5], "3": [38.25, 31.55], "4": [31.5, 43.48], "5": [33.75, 52.4], "6": [33.75, 62.5], "7": [20.25, 54.5], "8": [23.25, 88.18], "9": [29.5, 74.5], "10": [34.5, 87.5], "11": [63.5, 28.5], "12": [77.5, 16.5]}};</script>
<script>
(function(){
  var S = window.CARD_DATA.strokes, N = window.CARD_DATA.numpos;
  var svg = document.getElementById('player-svg');
  var NS = 'http://www.w3.org/2000/svg';
  var paths = [], overlay = null;
  S.forEach(function(d){
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(p);
    paths.push(p);
  });
  var step = 0; // 0=完成形, 1..n=その画まで
  var n = S.length, timer = null;
  var label = document.getElementById('player-label');
  function clearOverlay(){ if (overlay) { overlay.remove(); overlay = null; } }
  function mark(i){
    clearOverlay();
    var pos = N[String(i)];
    if (!pos) return;
    overlay = document.createElementNS(NS, 'g');
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', pos[0]+2); c.setAttribute('cy', pos[1]-3);
    c.setAttribute('r', 7.5); c.setAttribute('fill', '#e03131');
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', pos[0]+2); t.setAttribute('y', pos[1]-3);
    t.setAttribute('font-size', 10); t.setAttribute('font-weight', 'bold');
    t.setAttribute('fill', '#fff'); t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'central'); t.setAttribute('font-family', 'sans-serif');
    t.textContent = i;
    overlay.appendChild(c); overlay.appendChild(t);
    svg.appendChild(overlay);
  }
  function render(animate){
    paths.forEach(function(p, idx){
      var i = idx + 1;
      p.style.transition = '';
      p.style.strokeDasharray = '';
      p.style.strokeDashoffset = '';
      if (step === 0) {
        p.setAttribute('stroke', '#222'); p.setAttribute('stroke-width', 4);
        p.style.visibility = 'visible';
      } else if (i < step) {
        p.setAttribute('stroke', '#b9b3a6'); p.setAttribute('stroke-width', 4);
        p.style.visibility = 'visible';
      } else if (i === step) {
        p.setAttribute('stroke', '#e03131'); p.setAttribute('stroke-width', 5);
        p.style.visibility = 'visible';
        if (animate) {
          var L = p.getTotalLength();
          p.style.strokeDasharray = L;
          p.style.strokeDashoffset = L;
          p.getBoundingClientRect();
          p.style.transition = 'stroke-dashoffset .6s ease';
          p.style.strokeDashoffset = '0';
        }
      } else {
        p.style.visibility = 'hidden';
      }
    });
    if (step === 0) { clearOverlay(); label.textContent = 'かんせい(' + n + 'かく)'; }
    else { mark(step); label.textContent = step + 'かくめ / ' + n + 'かく'; }
  }
  function stopAuto(){ if (timer) { clearInterval(timer); timer = null;
    document.getElementById('btn-auto').textContent = '▶ じどう'; } }
  document.getElementById('btn-next').addEventListener('click', function(){
    stopAuto(); step = (step >= n) ? 0 : step + 1; render(true);
  });
  document.getElementById('btn-prev').addEventListener('click', function(){
    stopAuto(); step = (step <= 0) ? n : step - 1; render(false);
  });
  document.getElementById('btn-reset').addEventListener('click', function(){
    stopAuto(); step = 0; render(false);
  });
  document.getElementById('btn-auto').addEventListener('click', function(){
    if (timer) { stopAuto(); return; }
    this.textContent = '⏸ とめる';
    step = 1; render(true);
    timer = setInterval(function(){
      if (step >= n) { stopAuto(); return; }
      step += 1; render(true);
    }, 900);
  });
  svg.addEventListener('click', function(){
    stopAuto(); step = (step >= n) ? 0 : step + 1; render(true);
  });
  render(false);
})();
</script>
